  const isStr = (v) => typeof v === "string" && v.trim().length > 0;

  const fill = (tpl, map) => tpl.replace(/\{\{([\w.]+)\}\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(map, k) ? map[k] : m));
  const paraHtml = (s, style) => paragraphs(s).map((t) => `<p style="${style}">${esc(t)}</p>`).join("");

  function renderIssue(issue, template) {
    const is = issue && typeof issue === "object" ? issue : {};
    const items = (Array.isArray(is.items) ? is.items : []).filter((it) => it && typeof it === "object");
    const cta = is.cta && typeof is.cta === "object" && !Array.isArray(is.cta) ? is.cta : {};

    const blockRe = /([ \t]*)<!-- item:begin -->([\s\S]*?)<!-- item:end -->/;
    const itemBlock = tplSrc.match(blockRe);
    if (!itemBlock) return { html: "", text: "", problems: ["Das Template hat keinen Block item:begin / item:end."] };
    const portfolioRe = /([ \t]*)<!-- portfolio:begin -->([\s\S]*?)<!-- portfolio:end -->/;

    const itemsHtml = items.map((it) => fill(itemBlock[2], {

      "item.url": esc(okUrl(it.url) || "#"), "item.date": esc(deDate(it.date)),

    let tpl = tplSrc.replace(blockRe, () => "{{items}}");
    tpl = tpl.replace(portfolioRe, (_m, _ws, inner) => (isStr(is.portfolioNews) ? inner : ""));

    const p = "margin:0 0 12px 0;";
    const map = {
      issueTitle: esc(is.issueTitle),
      issueDate: esc(deDate(is.issueDate)),
      editorial: paraHtml(is.editorial, p),
      items: itemsHtml,
      portfolioNews: isStr(is.portfolioNews) ? paraHtml(is.portfolioNews, p) : "",

      "cta.url": esc(okUrl(cta.url) || "#"),
      footer: esc(isStr(is.footer) ? is.footer : DEFAULT_FOOTER),
    };
    const html = fill(tpl, map);

    const left = [...html.matchAll(/\{\{([\w.]+)\}\}/g)].map((m) => m[1]).filter((k) => !SERVICE_PLACEHOLDERS.includes(k));
    if (left.length) return { html: "", text: "", problems: [`Das Template hat unbekannte Platzhalter: ${[...new Set(left)].join(", ")}`] };

    const t = (v) => String(v ?? "").trim();
    const lines = [];
    lines.push(t(is.issueTitle), deDate(is.issueDate), "", "EDITORIAL", "", paragraphs(is.editorial).join("\n\n"), "", "DIESE WOCHE", "");

      lines.push(`${i + 1}. ${t(it.title)}`, t(it.summary), `Quelle: ${t(it.sourceName)} · ${deDate(it.date)}`);

    return { html, text: lines.join("\n"), problems: [] };

    else if (!isoDay(issue.issueDate)) add("issueDate", "Das Datum muss JJJJ-MM-TT sein.", "format");
    if (!isStr(issue.editorial)) add("editorial", "Das Editorial fehlt.", "complete");
    else if (issue.editorial.length > NL_LIMITS.editorial) add("editorial", `Das Editorial hat ${issue.editorial.length} Zeichen, erlaubt sind ${NL_LIMITS.editorial}.`, "complete");
    const items = Array.isArray(issue.items) ? issue.items : [];
    const thinOk = issue.thin === true && isStr(issue.thinReason) && items.length >= 1 && items.length < NL_LIMITS.itemsMin;
    if (!thinOk && (items.length < NL_LIMITS.itemsMin || items.length > NL_LIMITS.itemsMax)) {
      add("items", `${items.length} Beiträge, nötig sind ${NL_LIMITS.itemsMin} bis ${NL_LIMITS.itemsMax}` + (items.length >= 1 && items.length < NL_LIMITS.itemsMin ? " (eine dünne Ausgabe braucht das Häkchen und eine Begründung)" : "") + ".", "complete");
    }
    items.forEach((it, i) => {
      const n = `Beitrag ${i + 1}`, k = `items.${i}`;

      else if (it.summary.length > NL_LIMITS.summary) add(`${k}.summary`, `${n}: ${it.summary.length} Zeichen, erlaubt sind ${NL_LIMITS.summary}.`, "complete");
      if (!isStr(it.sourceName)) add(`${k}.sourceName`, `${n}: der Quellenname fehlt.`, "complete");
      if (!isStr(it.url)) add(`${k}.url`, `${n}: die Quell-URL fehlt.`, "complete");
      else if (!isHttps(it.url)) add(`${k}.url`, `${n}: nur https-Adressen sind erlaubt.`, "format");
      if (!isStr(it.date)) add(`${k}.date`, `${n}: das Datum fehlt.`, "complete");
      else if (!isoDay(it.date)) add(`${k}.date`, `${n}: das Datum muss JJJJ-MM-TT sein.`, "format");

    else {
      if (!isStr(issue.cta.text)) add("cta.text", "Der Text des Call-to-Action fehlt.", "complete");
      if (!isStr(issue.cta.url)) add("cta.url", "Die URL des Call-to-Action fehlt.", "complete");
      else if (!isHttps(issue.cta.url)) add("cta.url", "Nur https-Adressen sind erlaubt.", "format");

      if (!line.trim()) { flushP(); flushL(); continue; }
      flushL(); para.push(line.trim());

  const CH = (() => {

    const ABOUT = `Content channels of ${CONFIG.fundName || "the fund"}: where newsletters, articles and whitepapers can be published. Written by the Profile page; every write creates a new file and renames the previous one to _archived-<time>-${FILE_TITLE}. Channels are switched off, never deleted.`;
    const SEED = [
      { id: "linkedin-company", name: "LinkedIn Company Page", kind: "linkedin", target: "Company Page des Fonds", url: "", types: ["newsletter", "article", "whitepaper"], limit: 3000, enabled: true },
      { id: "linkedin-personal", name: "LinkedIn persönlich", kind: "linkedin", target: "Eigenes Profil", url: "", types: ["article", "whitepaper"], limit: 3000, enabled: true },
      { id: "website", name: "Webseite", kind: "website", target: "Website des Fonds", url: "", types: ["article"], limit: 0, enabled: true },
      { id: "whatsapp-community", name: "WhatsApp Community", kind: "whatsapp", target: "Community des Fonds", url: "", types: ["newsletter", "article"], limit: 1500, enabled: true },

    const seedChannels = () => SEED.map((c) => normChannel(c));

    function parseChannels(text) {
      let o;
      try { o = JSON.parse(text); } catch { return { ok: false, reason: "Die Datei ist kein gültiges JSON.", channels: [], dropped: 0 }; }
      if (!o || typeof o !== "object" || Array.isArray(o) || !Array.isArray(o.channels)) return { ok: false, reason: "Die Datei hat kein Feld channels.", channels: [], dropped: 0 };

    const norm = (t) => String(t ?? "").replace(/\r\n?/g, "\n").trim();
    // Auf `limit` Codepunkte kürzen (nicht UTF-16-Einheiten: Emoji und Umlaute zählen je eins), mit „…“; die Adresse des Beitrags bleibt am Ende erhalten.
    // Ist das Limit kürzer als die Adresse (plus „…“ und Leerzeile), bleibt die Adresse ganz und der Text entfällt: eine mittendrin abgeschnittene Adresse wäre ein toter Link.
    // Das Ergebnis ist dann länger als das Limit; ein so kleines Limit ist eine Fehleinstellung des Kanals.
    function cutForChannel(text, limit, link) {

    // encodeURIComponent wirft bei einem einzelnen Surrogat; es wird vorher durch U+FFFD ersetzt.
    const wellFormed = (s) => String(s ?? "").replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "\uFFFD");

      if (ch.kind === "whatsapp") return `https://wa.me/?text=${encodeURIComponent(t)}`;

    const fence = (v, n) => cutCp(norm(v), n).replace(/={3,}/g, "= = =");
    function suggestPrompt(p, ch) {
      const lim = Number.isInteger(ch?.limit) && ch.limit > 0 ? `höchstens ${ch.limit} Zeichen` : "ohne feste Längengrenze, aber kurz";
      return [
        `Du schreibst die Kanalfassung eines Beitrags des Venture-Fonds ${CONFIG.fundName || "(Fonds)"} für den Kanal „${fence(ch?.name, 80)}“ (Art: ${has(KIND_DE, ch?.kind) ? KIND_DE[ch.kind] : "unbekannt"}; ${lim}).`,
        "Regeln: Sprache des Materials beibehalten. Nichts erfinden: keine Zahlen, Namen oder Zusagen, die nicht im Material stehen. Sachlich, kein Werbeton, höchstens zwei Hashtags. Die Adresse des Beitrags unverändert ans Ende setzen, wenn eine angegeben ist.",

    // Die Antwort von sample: ein Text oder {text}; ohne Steuerzeichen, auf das Limit gekürzt. Sie füllt nur das Textfeld; gesendet wird nichts.
    function takeSuggestion(raw, ch, link) {
      const s = typeof raw === "string" ? raw : raw && typeof raw === "object" && typeof raw.text === "string" ? raw.text : "";

    // ── Drive: dieselben Muster wie die Liste pr-index.json (create_file, Umbenennen statt Verschieben) ──
    const folderArg = (f) => { if (typeof f !== "string" || !/^[\w-]+$/.test(f)) throw err("bad_folder", "Ungültige Ordnerkennung."); return f; };
    const filesOf = (p) => (Array.isArray(p?.files) ? p.files.filter((f) => f && typeof f === "object" && typeof f.id === "string" && f.id) : []);

    const archivedTitle = (title, nowIso) => `_archived-${String(nowIso).replace(/\.\d+Z?$/, "").replace(/[-:]/g, "").replace(/Z$/, "").slice(0, 15)}-${title}`;
    const viewUrl = (f) => { const u = httpsUrl(f?.viewUrl); return u || (typeof f?.id === "string" && /^[\w-]+$/.test(f.id) ? `https://drive.google.com/file/d/${f.id}/view` : ""); };
    // Alle aktuellen Dateien, die genau so heißen wie FILE_TITLE (Standard content-channels.json), im Ordner (neueste zuerst). Nur diese Kennungen werden je umbenannt.

    async function readChannels(call, folderId, cache, nowIso) {

    // Nach dem Anlegen wird neu aufgelistet: liegt eine fremde Kanal-Datei (FILE_TITLE) daneben (ein zweiter Schreiber), wird alles noch einmal zusammengeführt und geschrieben (concurrent).
    async function writeChannels(call, c) {

    if (tool !== "gmail-partners") return `${head}<div class="note warn"><b>${esc(label)} ist für diese Seite noch nicht verbunden.</b> Es wird nichts gesendet. Bis zur Anbindung: Auswahl in <code>settings/newsletter.sendVia</code> auf <code>gmail-partners</code> lassen.</div>${msg}${historyHtml(d)}`;
    const to = toDrafts.has(d.id) ? toDrafts.get(d.id) : parseRecipients(settings.partnersTo).list.join(", ");
    const rc = parseRecipients(to);
    const confirm = confirmOpen === "draft" ? `<div class="note acc"><b>Gmail-Entwurf anlegen?</b>
        <div>Empfänger: <b>${esc(rc.list.join(", "))}</b></div><div>Betreff: <b>${esc(work.title.trim())}</b></div>
        <div class="sub">Es entsteht nur ein Entwurf in deinem Postfach (HTML und Text). Gesendet wird erst, wenn du in Gmail auf Senden klickst. Die Platzhalter <code>{{postalAddress}}</code> und <code>{{unsubscribeUrl}}</code> bleiben stehen; für den Newsletter-Dienst sind sie gedacht.</div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="handover-go" ${busy ? "disabled" : ""}>Entwurf anlegen</button><button type="button" class="btn" data-act="confirm-cancel">Abbrechen</button></div></div>` : "";
    return `${head}${msg}<div><label class="lbl" for="toInp">Empfänger (Partner-Adressen, durch Komma getrennt)</label><input id="toInp" value="${esc(to)}" placeholder="partner1@…, partner2@…" ${canWrite() ? "" : "disabled"}></div>
      ${confirm}<div class="row"><button type="button" class="btn primary" data-act="handover" ${why || !mcp || busy ? "disabled" : ""}>Als Gmail-Entwurf übergeben</button><span class="s">${esc(why || (mcp ? "" : "Keine Connectoren in dieser Ansicht."))}</span></div>${historyHtml(d)}`;
  }
  function renderHandover() { const h = $("handover"), d = cur(); if (h && d && work) h.innerHTML = handoverHtml(d); }
  function refreshPane() { const d = cur(); if (d && work && workId === d.id && $("pane") && tab !== "edit") { $("pane").innerHTML = paneHtml(d); showProblems(); } }
  function paneHtml(d) {
    const ro = d.status === "sent" || !canWrite();
    if (tab === "edit") return editHtml(ro);
    const r = rendered();
    if (tab === "text") return `<div class="nlpane"><div class="row" style="margin-bottom:6px"><span class="s">Nur Text · so liegt er im Entwurf</span></div><pre>${esc(r.text)}</pre></div>`;
    return `<div class="nlpane"><div class="row" style="margin-bottom:6px"><span class="s">HTML-Vorschau (ohne Skripte, ohne Formulare) · Template: ${esc(tplName(work.templateId))}</span></div>${r.problems.length ? `<div class="note bad">${r.problems.map(esc).join("<br>")}</div>` : `<iframe sandbox="" srcdoc="${esc(withCsp(r.html))}" title="Newsletter-Vorschau"></iframe>`}</div>
      ${pickerHtml(ro)}
      <div id="handover">${handoverHtml(d)}</div>
      <div id="probs"></div>`;
  }
  function renderMain() {
    const d = cur();
    if (!selectedId) { $("main").innerHTML = `<div class="empty">Links eine Ausgabe wählen, oder „Neuer Entwurf“.</div>`; return; }
    if (!d) { $("main").innerHTML = `<div class="empty"><span class="spin"></span> Lade…</div>`; return; }
    if (workId !== d.id) { work = edits.get(d.id) ?? fromDoc(d); workId = d.id; baseStamp = str(d.updatedAt); }
    $("main").innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><span class="kind ${statusClass(d.status)}">${esc(statusLabel(d.status))}</span><div class="ttl">${esc(work.title || "(ohne Titel)")}</div><div class="s">${esc(deDate(work.issueDate))} · zuletzt ${esc(d.updatedBy ?? d.createdBy ?? "?")} ${esc(str(d.updatedAt ?? d.createdAt).slice(0, 16).replace("T", " "))}${d.status === "sent" ? " · gesendet, nur noch lesbar" : ""}</div></div>
        <div class="tabs" role="tablist" id="tabs">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" class="${tab === k ? "on" : ""}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
      </div>
      <div class="row"><button type="button" class="btn" data-act="pub" ${canDrive() && indexWritable() ? "" : "disabled"}>Veröffentlichen</button>${pubLineHtml(nlItemFor(d))}</div>
      <div id="msg"></div>
      <div id="pane">${paneHtml(d)}</div>`;
    showProblems();
  }
  function showMsg(kind, html) { const m = $("msg"); if (m) m.innerHTML = html ? `<div class="note ${kind}">${html}</div>` : ""; }

  // Fehler je Feld und Gesamtliste, ohne die Eingabefelder neu zu zeichnen (sonst springt der Cursor).
  function showProblems() {
    if (!work) return;
    const ps = checkFields(docToIssue(work)), first = new Map();
    for (const p of ps) if (!first.has(p.path)) first.set(p.path, p);
    for (const el of document.querySelectorAll("[data-err]")) { const p = first.get(el.dataset.err); el.textContent = p ? p.msg : ""; }
    for (const el of document.querySelectorAll("[data-p]")) { const path = el.dataset.p === "title" ? "issueTitle" : el.dataset.p.replace(/^issue\./, ""); el.classList.toggle("bad", ps.some((p) => p.path === path && p.level === "format")); }
    const probs = $("probs");
    if (probs) probs.innerHTML = ps.length ? `<h2 style="margin:12px 0 6px">Vor dem Übergeben</h2><ul class="probs">${ps.map((p) => `<li class="${p.level === "format" ? "bad" : ""}">${esc(p.msg)}</li>`).join("")}</ul>` : `<div class="note ok" style="margin-top:12px"><b>Die Struktur stimmt.</b> 3 bis 5 Beiträge, https-Quellen, Datum, ein Call-to-Action.</div>`;
    const dirty = isDirty(), hint = $("saveHint"), btn = $("saveBtn");
    if (hint) hint.innerHTML = ps.some((p) => p.level === "format") ? "Speichern gesperrt, bis die roten Felder stimmen." : dirty ? '<span class="dirty">Ungespeicherte Änderungen</span>' : "Gespeichert.";
    if (btn && cur()?.status !== "sent" && canWrite()) btn.disabled = busy || !dirty || ps.some((p) => p.level === "format");
    renderHandover();
  }

  // ── Eingaben ─────────────────────────────────────────────────────────────────
  const BAD_KEY = new Set(["__proto__", "constructor", "prototype"]);
  function setPath(obj, path, value) {
    const seg = path.split(".");
    if (seg.some((s) => BAD_KEY.has(s) || !/^\w+$/.test(s))) return false;
    let o = obj;
    for (let i = 0; i < seg.length - 1; i++) { o = o[seg[i]]; if (o == null || typeof o !== "object") return false; }
    o[seg[seg.length - 1]] = value; return true;
  }
  function afterEdit() {
    const d = cur(); if (!d) return;
    if (isDirty()) edits.set(d.id, work); else edits.delete(d.id);
    showProblems(); renderArchive();
    const t = document.querySelector(".ttl"); if (t) t.textContent = work.title || "(ohne Titel)";
  }
  function onInput(e) {
    if (e.target.id === "toInp") { if (selectedId) toDrafts.set(selectedId, e.target.value); return; }
    const el = e.target.closest("[data-p]"); if (!el || !work) return;
    const v = el.type === "checkbox" ? el.checked : el.value;
    if (!setPath(work, el.dataset.p, v)) return;
    if (el.dataset.p === "issue.thin") { $("pane").innerHTML = paneHtml(cur()); }
    afterEdit();
  }
  function onAction(e) {
    const tp = e.target.closest("[data-tpl]");
    if (tp && work && !tp.disabled) { const id = tp.dataset.tpl; if (id === "embedded" || tplOk(id)) { work.templateId = id; afterEdit(); refreshPane(); } return; }
    const td = e.target.closest("[data-tpl-default]");
    if (td && !td.disabled) { const id = td.dataset.tplDefault; if (id === "embedded" || tplOk(id)) setDefaultTemplate(id); return; }
    const b = e.target.closest("[data-act]"); if (!b || !work) return;
    const it = work.issue.items, i = Number(b.dataset.i);
    switch (b.dataset.act) {
      case "add": it.push(normItem({})); break;
      case "rm": if (i >= 0 && i < it.length) it.splice(i, 1); break;
      case "up": if (i > 0 && i < it.length) [it[i - 1], it[i]] = [it[i], it[i - 1]]; break;
      case "down": if (i >= 0 && i < it.length - 1) [it[i + 1], it[i]] = [it[i], it[i + 1]]; break;
      case "save": save(); return;
      case "pub": { const d = cur(); if (d) openPub(nlItemFor(d)); return; }
      case "tplReload": loadTemplates(true); return;
      case "handover": startHandover(); return;
      case "handover-go": handover(); return;
      case "sent": confirmOpen = "sent"; handMsg = null; renderHandover(); return;
      case "sent-go": markSent(); return;
      case "confirm-cancel": confirmOpen = null; renderHandover(); return;
      default: return;
    }
    $("pane").innerHTML = paneHtml(cur()); afterEdit();
  }

  // ── Speicher schreiben ───────────────────────────────────────────────────────
  // update() führt in den bestehenden Eintrag ein (Felder der Routine wie runId, approvalId bleiben); set() legt neu an.
  async function write(id, patch) {
    const ref = db.doc(`issues/${id}`);
    if (issues.some((x) => x.id === id)) await ref.update(patch); else await ref.set(patch);
  }
  async function save() {
    const d = cur(); if (!d || !canWrite() || busy) return;
    if (checkFields(docToIssue(work)).some((p) => p.level === "format")) { showMsg("bad", "<b>Nicht gespeichert.</b> Ein Feld ist ungültig; die roten Felder zuerst korrigieren."); return; }
    busy = true; showProblems();
    const r = rendered(), it = work.issue;
    const patch = {
      title: work.title.trim(), issueDate: work.issueDate.trim(), templateId: work.templateId,
      issue: { editorial: it.editorial, items: it.items.map(normItem), portfolioNews: it.portfolioNews, cta: { text: it.cta.text, url: it.cta.url }, thin: it.thin === true, thinReason: it.thinReason },
      ...(r.problems.length ? {} : { html: r.html, text: r.text }),
      updatedAt: new Date().toISOString(), updatedBy: actor,
    };
    try { await write(d.id, patch); edits.delete(d.id); renderArchive(); showProblems(); showMsg("ok", "<b>Gespeichert.</b>"); log(`save issues/${d.id}`); syncIssueTitle(d.id, patch.title); }
    catch (e) { showMsg("bad", `<b>Nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); log(`save ${e?.code ?? "?"} ${e?.message ?? ""}`); }
    finally { busy = false; showProblems(); }
  }
  async function newDraft() {
    if (!canWrite() || busy) return;
    busy = true; $("newBtn").disabled = true;
    try {
      const ref = db.collection("issues").doc(), now = new Date().toISOString(), e = issueFromTemplate(todayIso());
      await ref.set({
        title: e.issueTitle, issueDate: e.issueDate, status: "draft", templateId: str(settings.defaultTemplateId) || "embedded",
        issue: { editorial: e.editorial, items: e.items, portfolioNews: e.portfolioNews, cta: e.cta, thin: false, thinReason: "" },
        createdAt: now, createdBy: actor, updatedAt: now, updatedBy: actor,
      });
      selectedId = ref.id; workId = null; tab = "edit"; renderArchive(); renderMain(); log(`new issues/${ref.id}`);
      addIssueToIndex(ref.id, "", e.issueDate);
    } catch (e) { banner("bad", `<b>Der Entwurf wurde nicht angelegt.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); }
    finally { busy = false; $("newBtn").disabled = !canWrite(); }
  }
  async function setDefaultTemplate(id) {
    if (!canWrite() || busy) return;
    busy = true;
    try {
      const patch = { defaultTemplateId: id, updatedAt: new Date().toISOString(), updatedBy: actor };
      const ref = db.doc("settings/newsletter");
      if (settingsExists) await ref.update(patch); else await ref.set(patch);
      log(`settings/newsletter.defaultTemplateId ${id}`);
    } catch (e) { showMsg("bad", `<b>Standard nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); }
    finally { busy = false; refreshPane(); }
  }
  function startHandover() {
    const d = cur(); if (!d || !work || !mcp) return;
    const rc = parseRecipients(toDrafts.has(d.id) ? toDrafts.get(d.id) : settings.partnersTo);
    if (rc.list.length === 0 || rc.bad.length) { handMsg = { id: d.id, kind: "bad", html: rc.bad.length ? `<b>Keine gültige Adresse:</b> ${esc(rc.bad.join(", "))}` : "<b>Empfänger fehlen.</b> Mindestens eine Adresse eintragen." }; confirmOpen = null; }
    else { confirmOpen = "draft"; handMsg = null; }
    renderHandover();
  }
  // Gmail create_draft: HTML in htmlBody, Text in body. Ein Mensch sendet in Gmail.
  async function handover() {
    const d = cur(); if (!d || !work || busy || !canWrite() || !mcp || d.status !== "draft" || isDirty()) return;
    const rc = parseRecipients(toDrafts.has(d.id) ? toDrafts.get(d.id) : settings.partnersTo), r = rendered(), subject = work.title.trim();
    if (rc.list.length === 0 || rc.bad.length || r.problems.length || checkFields(docToIssue(work)).length) return;
    busy = true; handMsg = { id: d.id, kind: "", html: '<span class="spin"></span> Lege den Entwurf in Gmail an…' }; renderHandover();
    let created = null;
    try {
      const p = await call(GMAIL, "create_draft", { to: rc.list, subject, body: r.text, htmlBody: r.html }, { cache: false });
      const draftId = str(p?.id ?? p?.draft?.id), draftUrl = okUrl(p?.viewUrl ?? p?.draft?.viewUrl);
      created = { draftId, draftUrl };
      const now = new Date().toISOString();
      await write(d.id, { status: "approved", sentVia: "gmail-draft", updatedAt: now, updatedBy: actor, history: [...hist(d), { at: now, by: actor, action: "gmail-draft", to: rc.list, subject, ref: draftId ? `gmail:draft/${draftId}` : "gmail:draft" }] });
      handMsg = { id: d.id, kind: "ok", html: `<b>Entwurf liegt in Gmail.</b> ${draftUrl ? `<a href="${esc(draftUrl)}" target="_blank" rel="noopener">Entwurf öffnen</a>` : "Im Postfach unter Entwürfe."}` };
    } catch (e) {
      if (created) handMsg = { id: d.id, kind: "warn", html: `<b>Der Entwurf liegt in Gmail, aber der Status konnte nicht gespeichert werden.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")} Nicht noch einmal übergeben; die Ausgabe von Hand auf „Freigegeben“ bringen.` };
      else { const ambiguous = ["server_unavailable", "upstream_error", "cancelled"].includes(e?.code); handMsg = { id: d.id, kind: "bad", html: `${explain(e, GMAIL)}${ambiguous ? " <b>Der Entwurf kann trotzdem angelegt sein</b>; in Gmail prüfen, bevor du es erneut versuchst." : ""}` }; }
    } finally { busy = false; confirmOpen = null; renderHandover(); }
  }
  async function markSent() {
    const d = cur(); if (!d || busy || !canWrite() || d.status !== "approved") return;
    busy = true;
    try {
      const now = new Date().toISOString();
      await write(d.id, { status: "sent", sentAt: now, updatedAt: now, updatedBy: actor, history: [...hist(d), { at: now, by: actor, action: "sent" }] });
      handMsg = { id: d.id, kind: "ok", html: "<b>Als gesendet markiert.</b>" };
    } catch (e) { handMsg = { id: d.id, kind: "bad", html: `<b>Nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}` }; }
    finally { busy = false; confirmOpen = null; renderHandover(); }
  }
  function select(id) { selectedId = id; workId = null; confirmOpen = null; handMsg = null; renderArchive(); renderMain(); }

  // ==== pr-views:begin ====
  // F023 · Reiter Artikel und Template. Jeder Wert aus Drive (Liste, Artikeldatei, Template) wird nur über esc() in HTML gesetzt; Links nur https.
  const pill = (cls, text) => `<span class="kind ${cls}">${esc(text)}</span>`;
  const canDrive = () => !!mcp && canEdit !== false;
  const indexWritable = () => idx.status === "ok" || idx.status === "none";
  const indexErr = (e) => (e?.code === "index_unreadable" ? `<b>pr-index.json ist nicht lesbar</b> (${esc(e.message)}). Nichts wurde überschrieben; die Datei im Drive prüfen.` : e?.code === "create_failed" ? `<b>Drive hat die Datei nicht bestätigt.</b> ${esc(e.message)}` : explain(e, DRIVE));
  const nowIso = () => new Date().toISOString();
  // HTML, das diese Seite selbst aus esc() gebaut hat (Fehlertexte, Hinweise); nie ein Wert aus Drive.
  const ownHtml = (h) => String(h ?? "");

  // Die Liste neu aus dem Knowledge-Ordner lesen.
  async function loadIndex(force) {
    if (!mcp) { idx = { ...idx, status: "off", items: [], note: "" }; renderArtHead(); renderArtList(); return; }
    idx = { ...idx, status: "wait" }; renderArtHead(); renderArtList();
    try {
      const r = await readIndex(call, FOLDER_ID, force ? { staleTime: 0, refresh: true } : { staleTime: 300000 }, nowIso());
      if (r.state === "none") idx = { status: "none", fileId: "", updatedAt: "", updatedBy: "", items: [], raw: [], top: {}, about: "", version: 1, dropped: 0, note: "" };
      else if (r.state === "bad") idx = { status: "bad", fileId: r.fileId, updatedAt: "", updatedBy: "", items: [], raw: [], top: {}, about: "", version: 1, dropped: 0, note: r.reason };
      else idx = { status: "ok", fileId: r.fileId, updatedAt: r.index.updatedAt, updatedBy: r.index.updatedBy, items: r.index.items, raw: r.index.raw, top: r.index.top, about: r.index.about, version: r.index.version, dropped: r.index.dropped, note: "" };
    } catch (e) { idx = { status: "fail", fileId: "", updatedAt: "", updatedBy: "", items: [], raw: [], top: {}, about: "", version: 1, dropped: 0, note: indexErr(e) }; log(`pr-index lesen ${e?.code ?? "?"} ${e?.message ?? ""}`); }
    renderArtHead(); renderArtList();
  }
  // Eine Änderung an der Liste schreiben: nacheinander (nie zwei Schreibvorgänge gleichzeitig), mit Zusammenführen und Archivieren in writeIndex.
  function queueIndex(mutate) {
    const run = async () => {
      if (!indexWritable()) throw errCode("index_not_loaded", "Die Liste ist nicht geladen.");
      const items = mutate(idx.items.slice());
      const res = await writeIndex(call, { folderId: FOLDER_ID, loaded: idx.status === "ok" ? { fileId: idx.fileId, updatedAt: idx.updatedAt } : null, items, raw: idx.raw, top: idx.top, about: idx.about, version: idx.version, actor, now: nowIso() });
      idx = { status: "ok", fileId: res.fileId, updatedAt: res.index.updatedAt, updatedBy: res.index.updatedBy, items: res.index.items, raw: res.index.raw, top: res.index.top, about: res.index.about, version: res.index.version, dropped: 0, note: "" };
      log(`pr-index geschrieben ${res.fileId} · ${res.index.items.length} Einträge · ${res.changed ? "zusammengeführt" : "unverändert seit dem Laden"}${res.concurrent ? " · gleichzeitig gespeichert" : ""} · Archiv ${res.archived}`);
      return res;
    };
    const p = indexChain.then(run, run);
    indexChain = p.catch(() => {});
    return p;
  }
  function writeNote(res) {
    const parts = [];
    if (res.changed) parts.push(`<b>Die Liste wurde inzwischen geändert</b> (${esc(res.remoteBy || "?")}, ${esc(String(res.remoteAt).slice(0, 16).replace("T", " "))}). Zusammengeführt: ${Number(res.takenFromRemote)} Einträge von dort übernommen, je Eintrag gilt der neuere Stand.`);
    if (res.concurrent) parts.push("<b>Gleichzeitig gespeichert, zusammengeführt.</b> Eine zweite Liste lag daneben; beide wurden nach Kennung zusammengeführt und die abgelösten umbenannt.");
    if (res.archived === "renamed") parts.push("Die vorige Liste ist als <code>_archived-…-pr-index.json</code> umbenannt.");
    if (res.archived === "failed") parts.push("<b>Die vorige Liste konnte nicht umbenannt werden.</b> Sie bleibt liegen; gültig ist die Datei <code>pr-index.json</code> mit dem neuesten Stand.");
    return parts.join(" ");
  }
  // Neue Newsletter-Ausgaben dieser Seite kommen in die Liste (Kennung nl-<Ausgabe>, Quelle: Speicher dieser Seite).
  async function addIssueToIndex(issueId, title, issueDate) {
    if (!canDrive() || !indexWritable()) { log("pr-index: Ausgabe nicht eingetragen (keine Connectoren oder Liste nicht geladen)"); return; }
    const item = { id: `nl-${issueId}`, type: "newsletter", title: title || `Newsletter-Entwurf ${issueDate}`, status: "draft", owner: actor, source: { kind: "store", slug: issueId, url: LINKS.newsletter }, updatedAt: nowIso(), updatedBy: actor };
    try { await queueIndex((items) => upsertItem(items, item)); renderArtHead(); renderArtList(); }
    catch (e) { banner("warn", `<b>Der Entwurf ist angelegt, steht aber noch nicht in der gemeinsamen Liste.</b> ${indexErr(e)}`); }
  }

  // Der Titel einer Ausgabe ändert sich beim Speichern: der Listeneintrag zieht nach (nur wenn er schon in der Liste steht).
  async function syncIssueTitle(issueId, title) {
    const it = idx.items.find((x) => x.id === `nl-${issueId}`), t = str(title).trim();
    if (!it || !t || it.title === t || !canDrive() || !indexWritable()) return;
    try { await queueIndex((items) => upsertItem(items, { ...(items.find((x) => x.id === it.id) ?? it), title: t, updatedAt: nowIso(), updatedBy: actor })); renderArtHead(); renderArtList(); }
    catch (e) { log(`pr-index Titel ${e?.code ?? "?"} ${e?.message ?? ""}`); }
  }

  // ── Reiter Artikel ───────────────────────────────────────────────────────────
  const idxLine = () => idx.status === "wait" ? `<span class="spin"></span> Lese die Liste im Knowledge-Ordner…`
    : idx.status === "off" ? `<div class="note warn">Keine Connectoren in dieser Ansicht. Die gemeinsame Liste liegt im Knowledge-Ordner und braucht den Google-Drive-Connector.</div>`
    : idx.status === "fail" ? `<div class="note warn">${ownHtml(idx.note)}</div>`
    : idx.status === "bad" ? `<div class="note bad"><b>pr-index.json ist nicht lesbar:</b> ${esc(idx.note)} Schreiben ist gesperrt, bis die Datei im Drive stimmt.</div>`
    : idx.status === "none" ? `<div class="note warn">Im Ordner liegt noch keine <code>pr-index.json</code>. Der erste Artikel oder Entwurf legt sie an.</div>`
    : `<div class="s">${Number(idx.items.length)} Einträge · Stand ${esc(idx.updatedAt.slice(0, 16).replace("T", " "))} von ${esc(idx.updatedBy || "?")}${idx.dropped ? ` · <span class="dirty">${Number(idx.dropped)} Einträge nicht lesbar und übersprungen</span>` : ""}</div>`;
  function renderArtHead() {
    const h = $("artHead"); if (!h) return;
    h.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Gemeinsame Liste</h2><div class="row"><button type="button" class="btn sm" data-pa="reload" ${mcp ? "" : "disabled"}>Neu lesen</button><a class="btn sm" href="https://drive.google.com/drive/folders/${FOLDER_ID}" target="_blank" rel="noopener">Ordner im Drive</a></div></div>
      <div>${idxLine()}</div>

  // Kanäle kommen aus content-channels.json (CH, Region channels); die Seite sendet nie selbst: LinkedIn und WhatsApp öffnen den eigenen Teilen-Dialog

  // Gmail-Entwurf. Jede Übergabe hängt einen Eintrag an publications des Beitrags in der gemeinsamen Liste.
  const PUB_DE = { "handed-over": "übergeben", requested: "angefragt", published: "veröffentlicht" };

  // Titel, Teaser, Textauszug und Adresse des Beitrags für die Kanaltexte. Eine Artikeldatei wird nur gelesen, wenn der Ordner sie als article-<slug>.md kennt.

      const own1 = await ownArticleFile(call, FOLDER_ID, item.source.fileId);
      const q = own1 ? await call(DRIVE, "download_file_content", { fileId: own1.id }, { cache: false }) : null;
      const txt = q && typeof q.content === "string" ? b64utf8(q.content) : null;

  const PERM_TEXT = {

  const PERM_REQUEST_FAIL = "Die Anfrage ist fehlgeschlagen. Menü des Artefakts oben rechts → Berechtigungen.";
  const permKnown = (s) => (s === "granted" || s === "prompt" || s === "denied" ? s : "unavailable");
  const permText = (s) => PERM_TEXT[permKnown(s)];

  function permHtml(esc, state) {
    const s = permKnown(state);

  }
  // Reads without prompting and logs the answers verbatim: the full map, "mcp" and "sample". { mcp, sample, all } holds the raw answers.
  async function permRead(permissions, say) {
    const one = async (name) => { try { return await permissions.state(name); } catch (e) { say(`permissions.state("${name}") fehlgeschlagen: ${e?.code ?? "?"}`); return "unavailable"; } };
    let all = null;
    try { all = await permissions.state(); } catch (e) { say(`permissions.state() fehlgeschlagen: ${e?.code ?? "?"}`); }
    const mcp = await one("mcp"), sample = await one("sample");
    say(`permissions.state() = ${JSON.stringify(all) ?? "undefined"}`);

  }
  // What one click does. "request": one dialog for ["mcp"], branch on the returned state. "manage": open the panel, then read the state again. { state, reload, msg }: state null = unchanged; reload true only when mcp is granted. Never throws; never asks twice.
  async function permAct(kind, permissions, say) {
    if (kind === "request") {
      try {
        const res = await permissions.request(["mcp"]);
        say(`permissions.request(["mcp"]) = ${JSON.stringify(res) ?? "undefined"}`);
        const s = res && typeof res === "object" && "mcp" in res ? res.mcp : await permissions.state("mcp");
        return { state: permKnown(s), reload: s === "granted", msg: "" };
      } catch (e) { say(`permissions.request(["mcp"]) fehlgeschlagen: ${e?.code ?? "?"}`); return { state: null, reload: false, msg: PERM_REQUEST_FAIL }; }
    }
    if (kind === "manage") {
      try { await permissions.manage(); } catch (e) { say(`permissions.manage() abgelehnt: ${e?.code ?? "?"}`); return { state: null, reload: false, msg: PERM_MANAGE_FAIL }; }
      let s; try { s = await permissions.state("mcp"); } catch { s = "unavailable"; }
      say(`permissions.state("mcp") nach manage() = ${String(s)}`);
      return { state: permKnown(s), reload: s === "granted", msg: "" };
    }
    return { state: null, reload: false, msg: "" };
  }
  // The clicks of the box, delegated on the banner element (the box is repainted with it). One click at a time.
  function permBind(root, permissions, { say, reload }) {
    if (root.dataset.permBound === "1") return;
    root.dataset.permBound = "1";
    let busy = false;
    root.addEventListener("click", async (e) => {
      const b = e.target?.closest?.("[data-perm]"); if (!b || busy || !root.contains(b)) return;
      busy = true;
      const set = (sel, fn) => { const el = root.querySelector(sel); if (el) fn(el); };
      root.querySelectorAll("[data-perm]").forEach((x) => { x.disabled = true; });
      const r = await permAct(b.dataset.perm, permissions, say);
      if (r.state) set("[data-perm-text]", (el) => { el.textContent = permText(r.state); });
      set("[data-perm-msg]", (el) => { el.textContent = r.reload ? "Erlaubt. Die Seite lädt neu …" : r.msg; });
      root.querySelectorAll("[data-perm]").forEach((x) => { x.disabled = x.dataset.perm === "request" && r.state === "denied"; });
      busy = false;
      if (r.reload) reload();
    });
  }
  // The one call of a page whose use('mcp') came back null: reads the state, logs it, mounts the box under the banner (a hidden banner becomes this note), wires the buttons. Returns the read states, or null when the view has no `permissions` (then nothing is shown).
  async function permInit(root, { claude, esc, say, reload }) {
    let permissions = null;
    try { permissions = claude?.use ? await claude.use("permissions") : null; } catch (e) { say(`use('permissions'): ${e?.code ?? "?"}`); }
    if (!permissions || !root) { say("use('permissions') → null: keine Hilfe beim Erlauben von Connectoren in dieser Ansicht"); return null; }
    const perm = await permRead(permissions, say), box = permHtml(esc, perm.mcp);
    if (root.hidden) { root.className = "note warn"; root.innerHTML = `<b>Diese Ansicht erreicht keine Connectoren.</b> ${box}`; root.hidden = false; }
    else root.insertAdjacentHTML("beforeend", box);
    permBind(root, permissions, { say, reload });
    return perm;
  }
  // endregion:permhelp

  // ── Start ────────────────────────────────────────────────────────────────────
  function onIssues(snap) {
    issues = snap.docs.filter((x) => x.exists).map((x) => ({ ...x.data(), id: x.id }));
    renderArchive();
    const d = cur();
    if (selectedId && d) {
      const changed = workId !== d.id || str(d.updatedAt) !== baseStamp;
      if (!changed) return;
      if (workId === d.id && isDirty()) showMsg("warn", "<b>Eine neuere Version liegt im Speicher.</b> Speichern überschreibt sie.");
      else { workId = null; renderMain(); }
    } else renderMain();
  }
  (async () => {
    const [u, d, m, sm] = await Promise.all([
      window.claude?.use ? window.claude.use("user") : null,
      window.claude?.use ? window.claude.use("db") : null,
      window.claude?.use ? window.claude.use("mcp") : null,
      window.claude?.use ? window.claude.use("sample").catch(() => null) : null,
    ]);
    sampleFn = typeof sm === "function" ? sm : null;
    if (u) { try { const me = await u.me(); actor = (me?.name || "").trim() || (me?.id ? `user:${String(me.id).slice(0, 8)}` : "unbekannt"); canEdit = await u.canEdit().catch(() => null); } catch (e) { log(`user.me ${e?.code ?? e}`); } }
    log(`user ${u ? "ok" : "null"} · actor ${actor} · canEdit ${canEdit}`);
    db = d; mcp = m;
    if (!db) { setPill("connDb", "bad", "kein Speicher"); banner("bad", `<b>Diese Ansicht erreicht den Artefakt-Speicher nicht.</b> Im Browser auf claude.ai öffnen, angemeldet.`); $("archive").innerHTML = `<div class="empty">Kein Speicher in dieser Ansicht.</div>`; }
    else {
      setPill("connDb", "ok", "Speicher verbunden");
      db.collection("issues").onSnapshot(onIssues, (e) => { log(`issues.onSnapshot ${e?.code}`); setPill("connDb", "bad", "Speicher: " + e?.code); });
      db.collection("settings").onSnapshot((snap) => { const s = snap.docs.find((x) => x.exists && x.id === "newsletter"); settings = s ? s.data() : {}; settingsExists = !!s; refreshPane(); }, (e) => log(`settings.onSnapshot ${e?.code}`));
      $("newBtn").disabled = !canWrite();
      if (canEdit === false) banner("warn", `<b>Nur lesen.</b> Bearbeiten dürfen Editoren dieser Seite.`);
    }
    if (!mcp) await permInit($("banner"), { claude: window.claude, esc, say: log, reload: () => location.reload() });
    if (!mcp) { setPill("connMcp", "bad", "keine Connectoren"); loadTemplates(false); loadIndex(false); loadChannels(false); }
    else { setPill("connMcp", "wait", "Lese Templates…"); await Promise.all([loadTemplates(false), loadIndex(false), loadChannels(false)]); }
  })();
})();
</script>
