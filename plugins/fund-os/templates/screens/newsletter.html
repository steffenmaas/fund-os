    --accent: #0e9c90; --accent-ink: #ffffff; --alert: #c7233a; --warn: #b8780d; --good: #1f8a4c; --calm: #3f6f96; --violet: #6e4bb8;

<script>
(() => {
  "use strict";
  // ══ CONFIG ══ Everything that belongs to one fund. Fill it in before publishing (README.md); nothing below this block names a fund.
  const CONFIG = {
    fundName: "",            // shown in the side menu and in the header band of the built-in newsletter template, e.g. "Example Fund"
    newsletterFooter: "",    // the sender line in the footer of an issue and of its text version (until a template or an issue sets its own), e.g. "Example Fund"
    driveFolderId: "",       // Google Drive knowledge folder; the newsletter templates (newsletter-template*.html) are read from it (the id at the end of the folder URL)
    links: {  // The six side-menu URLs. Publish all screens first, then paste the six URLs here in EVERY screen (README.md).
      deals: "",
      investors: "",
      inbox: "",
      knowledge: "",
      newsletter: "",
      profile: "",
    },
  };
  // ==== newsletter-render:begin ====
  // Rein und ohne Seiteneffekte: dieselbe Grammatik wie `renderIssue` in tools/ops/newsletter-cli.mjs (Platzhalter {{…}},
  // der Beitragsblock item:begin/end, jedes Feld escaped). Fund OS prüft die beiden nicht gegeneinander: ändere sie zusammen.
  // Anders als die CLI bricht sie bei unfertigen Feldern nicht ab: ein Entwurf
  // bleibt sichtbar, unsichere Adressen fallen auf "#"; validateIssue sagt, was vor der Freigabe fehlt.
  const SERVICE_PLACEHOLDERS = ["unsubscribeUrl", "postalAddress"];
  const DEFAULT_FOOTER = CONFIG.newsletterFooter;
  const NL_LIMITS = { editorial: 1200, summary: 600, itemsMin: 3, itemsMax: 5 };
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const isStr = (v) => typeof v === "string" && v.trim().length > 0;
  const isHttps = (v) => {
    if (!isStr(v)) return false;
    try { const u = new URL(v); return u.protocol === "https:" && !!u.hostname; } catch { return false; }
  };
  const isoDay = (v) => (isStr(v) && /^\d{4}-\d{2}-\d{2}/.test(v) && !Number.isNaN(Date.parse(v.slice(0, 10))) ? v.slice(0, 10) : null);
  const deDate = (v) => { const d = isoDay(v); return d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : String(v ?? ""); };
  const paragraphs = (s) => String(s ?? "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
  const okUrl = (v) => (isHttps(v) ? String(v) : "");
  // Ein Durchlauf: der eingesetzte Text wird nie wieder nach Platzhaltern durchsucht.
  const fill = (tpl, map) => tpl.replace(/\{\{([\w.]+)\}\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(map, k) ? map[k] : m));
  const paraHtml = (s, style) => paragraphs(s).map((t) => `<p style="${style}">${esc(t)}</p>`).join("");

  function renderIssue(issue, template) {
    const is = issue && typeof issue === "object" ? issue : {};
    const items = (Array.isArray(is.items) ? is.items : []).filter((it) => it && typeof it === "object");
    const cta = is.cta && typeof is.cta === "object" && !Array.isArray(is.cta) ? is.cta : {};
    const tplSrc = typeof template === "string" ? template : "";
    const blockRe = /([ \t]*)<!-- item:begin -->([\s\S]*?)<!-- item:end -->/;
    const itemBlock = tplSrc.match(blockRe);
    if (!itemBlock) return { html: "", text: "", problems: ["Das Template hat keinen Block item:begin / item:end."] };
    const portfolioRe = /([ \t]*)<!-- portfolio:begin -->([\s\S]*?)<!-- portfolio:end -->/;

    const itemsHtml = items.map((it) => fill(itemBlock[2], {
      "item.title": esc(it.title), "item.summary": esc(it.summary), "item.sourceName": esc(it.sourceName),
      "item.url": esc(okUrl(it.url) || "#"), "item.date": esc(deDate(it.date)),
    })).join("");

    let tpl = tplSrc.replace(blockRe, () => "{{items}}");
    tpl = tpl.replace(portfolioRe, (_m, _ws, inner) => (isStr(is.portfolioNews) ? inner : ""));

    const p = "margin:0 0 12px 0;";
    const map = {
      issueTitle: esc(is.issueTitle),
      issueDate: esc(deDate(is.issueDate)),
      editorial: paraHtml(is.editorial, p),
      items: itemsHtml,
      portfolioNews: isStr(is.portfolioNews) ? paraHtml(is.portfolioNews, p) : "",
      "cta.text": esc(cta.text),
      "cta.url": esc(okUrl(cta.url) || "#"),
      footer: esc(isStr(is.footer) ? is.footer : DEFAULT_FOOTER),
    };
    const html = fill(tpl, map);

  const cur = () => issues.find((x) => x.id === selectedId) ?? null;
  const isDirty = () => { const d = cur(); return !!(d && work && JSON.stringify(work) !== JSON.stringify(fromDoc(d))); };
  // Vorlagen: „Eingebettet“ (Repository) oder eine Datei aus dem Knowledge-Ordner; fehlt die gewählte, gilt die eingebettete.
  const tplOk = (id) => templates.find((x) => x.id === id && x.ok);
  const templateFor = (id) => (id !== "embedded" && tplOk(id) ? tplOk(id).html : EMBEDDED_TEMPLATE);
  const tplName = (id) => (id === "embedded" ? "Eingebettet" : templates.find((x) => x.id === id)?.title ?? "unbekannt");
  let embeddedThumb = null;
  const hist = (d) => (Array.isArray(d?.history) ? d.history.filter((x) => x && typeof x === "object").slice(-50) : []);
  const rendered = () => renderIssue(docToIssue(work), templateFor(work.templateId));

  // ── Connectoren ──────────────────────────────────────────────────────────────
  const payload = (res) => { let p = res?.payload; if (typeof p === "string") { try { p = JSON.parse(p); } catch { /* Text */ } } return p; };
  async function call(server, tool, input, opts) { const t0 = Date.now(); try { const res = await mcp.callTool(server, tool, input, opts); const p = payload(res); log(`${server}.${tool} ok · ${Date.now() - t0} ms`, typeof p === "string" ? p.slice(0, 300) : (p && p.content ? { ...p, content: `[${String(p.content).length} base64-Zeichen]` } : p)); return p; } catch (e) { log(`${server}.${tool} ${e?.code ?? "?"} ${e?.message ?? ""}`, tool === "create_draft" ? { subject: input?.subject } : input); throw e; } }
  function explain(err, server) { const code = err?.code ?? "upstream_error"; switch (code) {
    case "needs_reauth": return `<b>${esc(server)} muss neu verbunden werden.</b> In claude.ai unter Einstellungen → Connectoren.`;
    case "server_not_connected": case "selection_required": return `<b>Kein ${esc(server)}-Connector in dieser Ansicht.</b> In claude.ai unter Einstellungen → Connectoren hinzufügen.`;
    case "not_in_manifest": return `<b>${esc(server)} ist für diese Seite nicht erlaubt.</b> Beim Aufruf erlauben.`;
    case "server_unavailable": case "rate_limited": return `<b>${esc(server)} hat nicht rechtzeitig geantwortet.</b> Gleich noch einmal.`;
    case "tool_error": return `<b>${esc(server)} meldet einen Fehler:</b> ${esc(err.message ?? "")}`;
    case "cancelled": return `<b>Abgebrochen.</b> Ausgang unbekannt; in ${esc(server)} prüfen.`;
    case "not_granted": case "capability_disabled": case "capability_removed": return `<b>Diese Ansicht erreicht keine Connectoren.</b> Im Browser auf claude.ai öffnen, angemeldet.`;
    default: return `<b>${esc(server)}: etwas ist fehlgeschlagen</b> (${esc(code)}). ${esc(err?.message ?? "")}`; } }

  // Vorlagen aus dem Knowledge-Ordner lesen: search_files im Ordner, download_file_content je newsletter-template*.html.
  async function loadTemplates(force) {
    if (!mcp) { tplStatus = "off"; tplNote = ""; refreshPane(); return; }
    tplStatus = "wait"; refreshPane();
    const cache = force ? { staleTime: 0, refresh: true } : { staleTime: 300000 };
    try {
      let files = [], pageToken;
      for (let page = 0; page < 10; page++) {
        const p = await call(DRIVE, "search_files", { query: `parentId = '${FOLDER_ID}'`, pageSize: 50, excludeContentSnippets: true, ...(pageToken ? { pageToken } : {}) }, { cache });
        const list = Array.isArray(p?.files) ? p.files : [];
        files = files.concat(list.filter(isTemplateFile));
        pageToken = p?.nextPageToken; if (!pageToken || list.length === 0) break;
      }
      files.sort((a, b) => str(a.title).localeCompare(str(b.title)));
      const found = [];
      for (const f of files) {
        const t = { id: str(f.id), title: str(f.title), modifiedTime: str(f.modifiedTime), viewUrl: str(f.viewUrl), html: "", thumb: "", ok: false, why: "" };
        if (!t.id) continue;
        try {
          const q = await call(DRIVE, "download_file_content", { fileId: t.id }, { cache });
          const txt = typeof q?.content === "string" ? b64utf8(q.content) : null;
          if (txt == null) t.why = "Inhalt nicht lesbar";
          else { const r = renderIssue(SAMPLE_ISSUE, txt); if (r.problems.length) t.why = r.problems[0]; else { t.html = txt; t.thumb = r.html; t.ok = true; } }
        } catch (e) { t.why = `Drive: ${e?.code ?? "Fehler"}`; }
        found.push(t);
      }
      templates = found; tplStatus = "ok"; tplNote = "";
      setPill("connMcp", "ok", `Drive · ${found.filter((x) => x.ok).length} Templates · Gmail`);
    } catch (e) { templates = []; tplStatus = "bad"; tplNote = explain(e, DRIVE); setPill("connMcp", "wait", "Drive: " + (e?.code ?? "Fehler")); }
    refreshPane();
  }

  // ── Archiv ───────────────────────────────────────────────────────────────────
  function renderArchive() {
    const list = [...issues].sort((a, b) => str(b.issueDate).localeCompare(str(a.issueDate)) || str(b.createdAt).localeCompare(str(a.createdAt)));
    $("archive").innerHTML = list.length ? list.map((d) => `<button type="button" class="itemcard ${d.id === selectedId ? "on" : ""}" data-id="${esc(d.id)}"><div class="row" style="justify-content:space-between"><span class="kind ${statusClass(d.status)}">${esc(statusLabel(d.status))}</span><span class="s">${esc(deDate(d.issueDate))}</span></div><div style="font-weight:600">${esc(d.title || "(ohne Titel)")}</div><div class="s">${esc(d.updatedBy ?? d.createdBy ?? "")}${edits.has(d.id) ? ' · <span class="dirty">ungespeichert</span>' : ""}</div></button>`).join("") : `<div class="empty">Noch keine Ausgabe. „Neuer Entwurf“ legt die erste an.</div>`;
  }

  // ── Hauptbereich ─────────────────────────────────────────────────────────────
  const rows = (v) => Math.max(4, Math.min(14, str(v).split("\n").length + 1));
  function field(path, label, val, opts = {}) {
    const dis = opts.ro ? "disabled" : "";
    const input = opts.area ? `<textarea id="f-${path}" data-p="${path}" class="${opts.cls ?? ""}" rows="${rows(val)}" ${dis}>${esc(val)}</textarea>` : `<input id="f-${path}" data-p="${path}" value="${esc(val)}" placeholder="${esc(opts.ph ?? "")}" ${dis}>`;
    return `<div><label class="lbl" for="f-${path}">${esc(label)}</label>${input}<div class="err" data-err="${esc(opts.err ?? path)}"></div></div>`;
  }
  function editHtml(ro) {
    const w = work, it = w.issue;
    const items = it.items.map((x, i) => `<div class="itemrow"><div class="row" style="justify-content:space-between"><b>Beitrag ${i + 1}</b><div class="row">
        <button type="button" class="btn sm" data-act="up" data-i="${i}" ${ro || i === 0 ? "disabled" : ""} aria-label="Beitrag ${i + 1} nach oben">↑</button>
        <button type="button" class="btn sm" data-act="down" data-i="${i}" ${ro || i === it.items.length - 1 ? "disabled" : ""} aria-label="Beitrag ${i + 1} nach unten">↓</button>
        <button type="button" class="btn sm danger" data-act="rm" data-i="${i}" ${ro ? "disabled" : ""}>Entfernen</button></div></div>
      <div class="grid2">${field(`issue.items.${i}.title`, "Titel", x.title, { ro, err: `items.${i}.title` })}${field(`issue.items.${i}.sourceName`, "Quelle (Name)", x.sourceName, { ro, err: `items.${i}.sourceName` })}</div>
      ${field(`issue.items.${i}.summary`, "Zusammenfassung", x.summary, { ro, area: true, err: `items.${i}.summary` })}
      <div class="grid2">${field(`issue.items.${i}.url`, "Quell-URL (https)", x.url, { ro, ph: "https://…", err: `items.${i}.url` })}${field(`issue.items.${i}.date`, "Datum (JJJJ-MM-TT)", x.date, { ro, ph: "2026-10-04", err: `items.${i}.date` })}</div></div>`).join("");
    return `<div class="grid2">${field("title", "Titel der Ausgabe", w.title, { ro, err: "issueTitle" })}${field("issueDate", "Datum der Ausgabe (JJJJ-MM-TT)", w.issueDate, { ro, ph: "2026-10-04", err: "issueDate" })}</div>
      ${field("issue.editorial", "Editorial (Absätze durch eine Leerzeile)", it.editorial, { ro, area: true, cls: "ed", err: "editorial" })}
      <div class="row" style="justify-content:space-between"><h2>Beiträge · ${it.items.length}</h2><button type="button" class="btn sm" data-act="add" ${ro ? "disabled" : ""}>Beitrag hinzufügen</button></div>
      <div class="err" data-err="items"></div>
      ${items || `<div class="sub">Noch kein Beitrag.</div>`}
      <label class="chk"><input type="checkbox" data-p="issue.thin" ${it.thin ? "checked" : ""} ${ro ? "disabled" : ""}> Dünne Ausgabe (1 bis 2 Beiträge, mit Begründung)</label>
      ${it.thin ? field("issue.thinReason", "Begründung", it.thinReason, { ro, err: "thinReason" }) : ""}
      ${field("issue.portfolioNews", "Portfolio und Fonds (optional)", it.portfolioNews, { ro, area: true, err: "portfolioNews" })}
      <div class="grid2">${field("issue.cta.text", "Call-to-Action: Text", it.cta.text, { ro, err: "cta.text" })}${field("issue.cta.url", "Call-to-Action: URL (https)", it.cta.url, { ro, ph: "https://…", err: "cta.url" })}</div>
      <div class="err" data-err="cta"></div>
      <div class="row"><button type="button" class="btn primary" id="saveBtn" data-act="save" ${ro ? "disabled" : ""}>Speichern</button><span class="s" id="saveHint"></span></div>`;
  }
  function pickerHtml(ro) {
    const embedded = { id: "embedded", title: "Eingebettet", ok: true, thumb: (embeddedThumb ??= renderIssue(SAMPLE_ISSUE, EMBEDDED_TEMPLATE).html), modifiedTime: "", why: "" };
    const defId = str(settings.defaultTemplateId) || "embedded";
    const cards = [embedded, ...templates].map((t) => {
      const on = work.templateId === t.id, def = defId === t.id;
      return `<div class="tplcard ${on ? "on" : ""}"><div class="thumb">${t.ok ? `<iframe sandbox="" srcdoc="${esc(t.thumb)}" title="Vorschau ${esc(t.title)}" tabindex="-1"></iframe>` : `<div class="empty">${esc(t.why)}</div>`}</div>
        <div style="font-weight:600;font-size:12.5px;word-break:break-all">${esc(t.title)}</div>
        <div class="s">${t.id === "embedded" ? "aus dem Repository" : "Drive · " + esc(t.modifiedTime.slice(0, 10))}${def ? " · Standard" : ""}</div>
        <div class="row"><button type="button" class="btn sm ${on ? "primary" : ""}" data-tpl="${esc(t.id)}" ${ro || !t.ok ? "disabled" : ""}>${on ? "Gewählt" : "Wählen"}</button>${def ? "" : `<button type="button" class="btn sm" data-tpl-default="${esc(t.id)}" ${!canWrite() || !t.ok ? "disabled" : ""}>Als Standard</button>`}</div></div>`;
    }).join("");
    const status = tplStatus === "wait" ? `<div class="sub"><span class="spin"></span> Lese den Knowledge-Ordner…</div>`
      : tplStatus === "off" ? `<div class="note warn">Keine Connectoren in dieser Ansicht. Es gilt das eingebettete Template.</div>`
      : tplStatus === "bad" ? `<div class="note warn">${tplNote} Es gilt das eingebettete Template.</div>`
      : templates.length === 0 ? `<div class="sub">Im Ordner „FUND OS Knowledge“ liegt kein <code>newsletter-template*.html</code>. Es gilt das eingebettete Template.</div>` : "";
    const fb = work.templateId !== "embedded" && !tplOk(work.templateId) ? `<div class="note warn">Das gewählte Template <code>${esc(work.templateId)}</code> ist nicht geladen; die Vorschau nutzt das eingebettete.</div>` : "";
    return `<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2>Template</h2><div class="row"><button type="button" class="btn sm" data-act="tplReload" ${mcp ? "" : "disabled"}>Neu lesen</button><a class="btn sm" href="https://drive.google.com/drive/folders/${FOLDER_ID}" target="_blank" rel="noopener">Ordner im Drive</a></div></div>${status}${fb}<div class="tplgrid">${cards}</div></div>`;
  }
  function historyHtml(d) {
    const h = hist(d);
    return h.length ? `<ul class="probs">${h.map((x) => `<li>${esc(str(x.at).slice(0, 16).replace("T", " "))} · ${esc(str(x.by))} · ${esc(str(x.action))}${Array.isArray(x.to) && x.to.length ? " · an " + esc(x.to.join(", ")) : ""}${x.ref ? " · " + esc(str(x.ref)) : ""}</li>`).join("")}</ul>` : "";
  }
  function handoverHtml(d) {
    const tool = own(SEND_TOOLS, settings.sendVia) ? settings.sendVia : "gmail-partners", label = SEND_TOOLS[tool];
    const head = `<h2>Übergeben</h2><div class="sub">Tool: <b>${esc(label)}</b> · Auswahl im Profil folgt (F016); bis dahin steht sie in <code>settings/newsletter.sendVia</code> dieser Seite (<a href="${esc(TOOL_SETTINGS_SOURCE)}" target="_blank" rel="noopener">Profil</a>). Ein Mensch klickt; nichts geht automatisch hinaus.</div>`;
    const msg = handMsg && handMsg.id === d.id ? `<div class="note ${esc(handMsg.kind)}">${handMsg.html}</div>` : "";
    if (d.status === "sent") return `${head}<div class="note ok"><b>Gesendet</b>${d.sentAt ? " am " + esc(str(d.sentAt).slice(0, 16).replace("T", " ")) : ""}${d.sentVia ? " über " + esc(str(d.sentVia)) : ""}. Diese Ausgabe ist nur noch lesbar.</div>${msg}${historyHtml(d)}`;
    const ps = checkFields(docToIssue(work)), dirty = isDirty();
    const why = !canWrite() ? "Nur Editoren dürfen übergeben." : dirty ? "Erst speichern; übergeben wird, was gespeichert ist." : ps.length ? `Die Struktur ist nicht vollständig (${ps.length} Hinweise unten).` : "";
    if (d.status === "approved") {
      return `${head}<div class="note ok"><b>Übergeben.</b> Der Entwurf liegt${d.sentVia === "gmail-draft" ? " in Gmail" : " bereit"}. Senden in Gmail, dann hier markieren.</div>${msg}
        ${confirmOpen === "sent" ? `<div class="note acc"><b>Wurde die Ausgabe wirklich gesendet?</b> Die Ausgabe wird danach nur noch lesbar.<div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="sent-go" ${busy ? "disabled" : ""}>Ja, als gesendet markieren</button><button type="button" class="btn" data-act="confirm-cancel">Abbrechen</button></div></div>` : `<div class="row"><button type="button" class="btn" data-act="sent" ${canWrite() ? "" : "disabled"}>Als gesendet markieren</button></div>`}${historyHtml(d)}`;
    }
    if (tool !== "gmail-partners") return `${head}<div class="note warn"><b>${esc(label)} ist für diese Seite noch nicht verbunden.</b> Es wird nichts gesendet. Bis zur Anbindung: Auswahl in <code>settings/newsletter.sendVia</code> auf <code>gmail-partners</code> lassen.</div>${msg}${historyHtml(d)}`;
    const to = toDrafts.has(d.id) ? toDrafts.get(d.id) : parseRecipients(settings.partnersTo).list.join(", ");
    const rc = parseRecipients(to);
    const confirm = confirmOpen === "draft" ? `<div class="note acc"><b>Gmail-Entwurf anlegen?</b>
        <div>Empfänger: <b>${esc(rc.list.join(", "))}</b></div><div>Betreff: <b>${esc(work.title.trim())}</b></div>
        <div class="sub">Es entsteht nur ein Entwurf in deinem Postfach (HTML und Text). Gesendet wird erst, wenn du in Gmail auf Senden klickst. Die Platzhalter <code>{{postalAddress}}</code> und <code>{{unsubscribeUrl}}</code> bleiben stehen; für den Newsletter-Dienst sind sie gedacht.</div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="handover-go" ${busy ? "disabled" : ""}>Entwurf anlegen</button><button type="button" class="btn" data-act="confirm-cancel">Abbrechen</button></div></div>` : "";
    return `${head}${msg}<div><label class="lbl" for="toInp">Empfänger (Partner-Adressen, durch Komma getrennt)</label><input id="toInp" value="${esc(to)}" placeholder="partner1@…, partner2@…" ${canWrite() ? "" : "disabled"}></div>
      ${confirm}<div class="row"><button type="button" class="btn primary" data-act="handover" ${why || !mcp || busy ? "disabled" : ""}>Als Gmail-Entwurf übergeben</button><span class="s">${esc(why || (mcp ? "" : "Keine Connectoren in dieser Ansicht."))}</span></div>${historyHtml(d)}`;
  }
  function renderHandover() { const h = $("handover"), d = cur(); if (h && d && work) h.innerHTML = handoverHtml(d); }
  function refreshPane() { const d = cur(); if (d && work && workId === d.id && $("pane") && tab !== "edit") { $("pane").innerHTML = paneHtml(d); showProblems(); } }
  function paneHtml(d) {
    const ro = d.status === "sent" || !canWrite();
    if (tab === "edit") return editHtml(ro);
    const r = rendered();
    if (tab === "text") return `<div class="nlpane"><div class="row" style="margin-bottom:6px"><span class="s">Nur Text · so liegt er im Entwurf</span></div><pre>${esc(r.text)}</pre></div>`;
    return `<div class="nlpane"><div class="row" style="margin-bottom:6px"><span class="s">HTML-Vorschau (ohne Skripte, ohne Formulare) · Template: ${esc(tplName(work.templateId))}</span></div>${r.problems.length ? `<div class="note bad">${r.problems.map(esc).join("<br>")}</div>` : `<iframe sandbox="" srcdoc="${esc(r.html)}" title="Newsletter-Vorschau"></iframe>`}</div>
      ${pickerHtml(ro)}
      <div id="handover">${handoverHtml(d)}</div>
      <div id="probs"></div>`;
  }
  function renderMain() {
    const d = cur();
    if (!selectedId) { $("main").innerHTML = `<div class="empty">Links eine Ausgabe wählen, oder „Neuer Entwurf“.</div>`; return; }
    if (!d) { $("main").innerHTML = `<div class="empty"><span class="spin"></span> Lade…</div>`; return; }
    if (workId !== d.id) { work = edits.get(d.id) ?? fromDoc(d); workId = d.id; baseStamp = str(d.updatedAt); }
    $("main").innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><span class="kind ${statusClass(d.status)}">${esc(statusLabel(d.status))}</span><div class="ttl">${esc(work.title || "(ohne Titel)")}</div><div class="s">${esc(deDate(work.issueDate))} · zuletzt ${esc(d.updatedBy ?? d.createdBy ?? "?")} ${esc(str(d.updatedAt ?? d.createdAt).slice(0, 16).replace("T", " "))}${d.status === "sent" ? " · gesendet, nur noch lesbar" : ""}</div></div>
        <div class="tabs" role="tablist" id="tabs">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" class="${tab === k ? "on" : ""}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
      </div>
      <div id="msg"></div>
      <div id="pane">${paneHtml(d)}</div>`;
    showProblems();
  }
  function showMsg(kind, html) { const m = $("msg"); if (m) m.innerHTML = html ? `<div class="note ${kind}">${html}</div>` : ""; }

  // Fehler je Feld und Gesamtliste, ohne die Eingabefelder neu zu zeichnen (sonst springt der Cursor).
  function showProblems() {
    if (!work) return;
    const ps = checkFields(docToIssue(work)), first = new Map();
    for (const p of ps) if (!first.has(p.path)) first.set(p.path, p);
    for (const el of document.querySelectorAll("[data-err]")) { const p = first.get(el.dataset.err); el.textContent = p ? p.msg : ""; }
    for (const el of document.querySelectorAll("[data-p]")) { const path = el.dataset.p === "title" ? "issueTitle" : el.dataset.p.replace(/^issue\./, ""); el.classList.toggle("bad", ps.some((p) => p.path === path && p.level === "format")); }
    const probs = $("probs");
    if (probs) probs.innerHTML = ps.length ? `<h2 style="margin:12px 0 6px">Vor dem Übergeben</h2><ul class="probs">${ps.map((p) => `<li class="${p.level === "format" ? "bad" : ""}">${esc(p.msg)}</li>`).join("")}</ul>` : `<div class="note ok" style="margin-top:12px"><b>Die Struktur stimmt.</b> 3 bis 5 Beiträge, https-Quellen, Datum, ein Call-to-Action.</div>`;
    const dirty = isDirty(), hint = $("saveHint"), btn = $("saveBtn");
    if (hint) hint.innerHTML = ps.some((p) => p.level === "format") ? "Speichern gesperrt, bis die roten Felder stimmen." : dirty ? '<span class="dirty">Ungespeicherte Änderungen</span>' : "Gespeichert.";
    if (btn && cur()?.status !== "sent" && canWrite()) btn.disabled = busy || !dirty || ps.some((p) => p.level === "format");
    renderHandover();
  }

  // ── Eingaben ─────────────────────────────────────────────────────────────────
  const BAD_KEY = new Set(["__proto__", "constructor", "prototype"]);
  function setPath(obj, path, value) {
    const seg = path.split(".");
    if (seg.some((s) => BAD_KEY.has(s) || !/^\w+$/.test(s))) return false;
    let o = obj;
    for (let i = 0; i < seg.length - 1; i++) { o = o[seg[i]]; if (o == null || typeof o !== "object") return false; }
    o[seg[seg.length - 1]] = value; return true;
  }
  function afterEdit() {
    const d = cur(); if (!d) return;
    if (isDirty()) edits.set(d.id, work); else edits.delete(d.id);
    showProblems(); renderArchive();
    const t = document.querySelector(".ttl"); if (t) t.textContent = work.title || "(ohne Titel)";
  }
  function onInput(e) {
    if (e.target.id === "toInp") { if (selectedId) toDrafts.set(selectedId, e.target.value); return; }
    const el = e.target.closest("[data-p]"); if (!el || !work) return;
    const v = el.type === "checkbox" ? el.checked : el.value;
    if (!setPath(work, el.dataset.p, v)) return;
    if (el.dataset.p === "issue.thin") { $("pane").innerHTML = paneHtml(cur()); }
    afterEdit();
  }
  function onAction(e) {
    const tp = e.target.closest("[data-tpl]");
    if (tp && work && !tp.disabled) { const id = tp.dataset.tpl; if (id === "embedded" || tplOk(id)) { work.templateId = id; afterEdit(); refreshPane(); } return; }
    const td = e.target.closest("[data-tpl-default]");
    if (td && !td.disabled) { const id = td.dataset.tplDefault; if (id === "embedded" || tplOk(id)) setDefaultTemplate(id); return; }
    const b = e.target.closest("[data-act]"); if (!b || !work) return;
    const it = work.issue.items, i = Number(b.dataset.i);
    switch (b.dataset.act) {
      case "add": it.push(normItem({})); break;
      case "rm": if (i >= 0 && i < it.length) it.splice(i, 1); break;
      case "up": if (i > 0 && i < it.length) [it[i - 1], it[i]] = [it[i], it[i - 1]]; break;
      case "down": if (i >= 0 && i < it.length - 1) [it[i + 1], it[i]] = [it[i], it[i + 1]]; break;
      case "save": save(); return;
      case "tplReload": loadTemplates(true); return;
      case "handover": startHandover(); return;
      case "handover-go": handover(); return;
      case "sent": confirmOpen = "sent"; handMsg = null; renderHandover(); return;
      case "sent-go": markSent(); return;
      case "confirm-cancel": confirmOpen = null; renderHandover(); return;
      default: return;
    }
    $("pane").innerHTML = paneHtml(cur()); afterEdit();
  }

  // ── Speicher schreiben ───────────────────────────────────────────────────────
  // update() führt in den bestehenden Eintrag ein (Felder der Routine wie runId, approvalId bleiben); set() legt neu an.
  async function write(id, patch) {
    const ref = db.doc(`issues/${id}`);
    if (issues.some((x) => x.id === id)) await ref.update(patch); else await ref.set(patch);
  }
  async function save() {
    const d = cur(); if (!d || !canWrite() || busy) return;
    if (checkFields(docToIssue(work)).some((p) => p.level === "format")) { showMsg("bad", "<b>Nicht gespeichert.</b> Ein Feld ist ungültig; die roten Felder zuerst korrigieren."); return; }
    busy = true; showProblems();
    const r = rendered(), it = work.issue;
    const patch = {
      title: work.title.trim(), issueDate: work.issueDate.trim(), templateId: work.templateId,
      issue: { editorial: it.editorial, items: it.items.map(normItem), portfolioNews: it.portfolioNews, cta: { text: it.cta.text, url: it.cta.url }, thin: it.thin === true, thinReason: it.thinReason },
      ...(r.problems.length ? {} : { html: r.html, text: r.text }),
      updatedAt: new Date().toISOString(), updatedBy: actor,
    };
    try { await write(d.id, patch); edits.delete(d.id); renderArchive(); showProblems(); showMsg("ok", "<b>Gespeichert.</b>"); log(`save issues/${d.id}`); }
    catch (e) { showMsg("bad", `<b>Nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); log(`save ${e?.code ?? "?"} ${e?.message ?? ""}`); }
    finally { busy = false; showProblems(); }
  }
  async function newDraft() {
    if (!canWrite() || busy) return;
    busy = true; $("newBtn").disabled = true;
    try {
      const ref = db.collection("issues").doc(), now = new Date().toISOString(), e = issueFromTemplate(todayIso());
      await ref.set({
        title: e.issueTitle, issueDate: e.issueDate, status: "draft", templateId: str(settings.defaultTemplateId) || "embedded",
        issue: { editorial: e.editorial, items: e.items, portfolioNews: e.portfolioNews, cta: e.cta, thin: false, thinReason: "" },
        createdAt: now, createdBy: actor, updatedAt: now, updatedBy: actor,
      });
      selectedId = ref.id; workId = null; tab = "edit"; renderArchive(); renderMain(); log(`new issues/${ref.id}`);
    } catch (e) { banner("bad", `<b>Der Entwurf wurde nicht angelegt.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); }
    finally { busy = false; $("newBtn").disabled = !canWrite(); }
  }
  async function setDefaultTemplate(id) {
    if (!canWrite() || busy) return;
    busy = true;
    try {
      const patch = { defaultTemplateId: id, updatedAt: new Date().toISOString(), updatedBy: actor };
      const ref = db.doc("settings/newsletter");
      if (settingsExists) await ref.update(patch); else await ref.set(patch);
      log(`settings/newsletter.defaultTemplateId ${id}`);
    } catch (e) { showMsg("bad", `<b>Standard nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}`); }
    finally { busy = false; refreshPane(); }
  }
  function startHandover() {
    const d = cur(); if (!d || !work || !mcp) return;
    const rc = parseRecipients(toDrafts.has(d.id) ? toDrafts.get(d.id) : settings.partnersTo);
    if (rc.list.length === 0 || rc.bad.length) { handMsg = { id: d.id, kind: "bad", html: rc.bad.length ? `<b>Keine gültige Adresse:</b> ${esc(rc.bad.join(", "))}` : "<b>Empfänger fehlen.</b> Mindestens eine Adresse eintragen." }; confirmOpen = null; }
    else { confirmOpen = "draft"; handMsg = null; }
    renderHandover();
  }
  // Gmail create_draft: HTML in htmlBody, Text in body. Ein Mensch sendet in Gmail.
  async function handover() {
    const d = cur(); if (!d || !work || busy || !canWrite() || !mcp || d.status !== "draft" || isDirty()) return;
    const rc = parseRecipients(toDrafts.has(d.id) ? toDrafts.get(d.id) : settings.partnersTo), r = rendered(), subject = work.title.trim();
    if (rc.list.length === 0 || rc.bad.length || r.problems.length || checkFields(docToIssue(work)).length) return;
    busy = true; handMsg = { id: d.id, kind: "", html: '<span class="spin"></span> Lege den Entwurf in Gmail an…' }; renderHandover();
    let created = null;
    try {
      const p = await call(GMAIL, "create_draft", { to: rc.list, subject, body: r.text, htmlBody: r.html }, { cache: false });
      const draftId = str(p?.id ?? p?.draft?.id), draftUrl = okUrl(p?.viewUrl ?? p?.draft?.viewUrl);
      created = { draftId, draftUrl };
      const now = new Date().toISOString();
      await write(d.id, { status: "approved", sentVia: "gmail-draft", updatedAt: now, updatedBy: actor, history: [...hist(d), { at: now, by: actor, action: "gmail-draft", to: rc.list, subject, ref: draftId ? `gmail:draft/${draftId}` : "gmail:draft" }] });
      handMsg = { id: d.id, kind: "ok", html: `<b>Entwurf liegt in Gmail.</b> ${draftUrl ? `<a href="${esc(draftUrl)}" target="_blank" rel="noopener">Entwurf öffnen</a>` : "Im Postfach unter Entwürfe."}` };
    } catch (e) {
      if (created) handMsg = { id: d.id, kind: "warn", html: `<b>Der Entwurf liegt in Gmail, aber der Status konnte nicht gespeichert werden.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")} Nicht noch einmal übergeben; die Ausgabe von Hand auf „Freigegeben“ bringen.` };
      else { const ambiguous = ["server_unavailable", "upstream_error", "cancelled"].includes(e?.code); handMsg = { id: d.id, kind: "bad", html: `${explain(e, GMAIL)}${ambiguous ? " <b>Der Entwurf kann trotzdem angelegt sein</b>; in Gmail prüfen, bevor du es erneut versuchst." : ""}` }; }
    } finally { busy = false; confirmOpen = null; renderHandover(); }
  }
  async function markSent() {
    const d = cur(); if (!d || busy || !canWrite() || d.status !== "approved") return;
    busy = true;
    try {
      const now = new Date().toISOString();
      await write(d.id, { status: "sent", sentAt: now, updatedAt: now, updatedBy: actor, history: [...hist(d), { at: now, by: actor, action: "sent" }] });
      handMsg = { id: d.id, kind: "ok", html: "<b>Als gesendet markiert.</b>" };
    } catch (e) { handMsg = { id: d.id, kind: "bad", html: `<b>Nicht gespeichert.</b> ${esc(e?.code ?? "")} ${esc(e?.message ?? "")}` }; }
    finally { busy = false; confirmOpen = null; renderHandover(); }
  }
  function select(id) { selectedId = id; workId = null; confirmOpen = null; handMsg = null; renderArchive(); renderMain(); }

  // ── Ereignisse ───────────────────────────────────────────────────────────────
  $("archive").addEventListener("click", (e) => { const c = e.target.closest("[data-id]"); if (c) select(c.dataset.id); });
  $("newBtn").addEventListener("click", newDraft);
  $("main").addEventListener("input", onInput);
  $("main").addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]");
    if (t && TABS.some(([k]) => k === t.dataset.tab)) { tab = t.dataset.tab; const d = cur(); if (d) { $("pane").innerHTML = paneHtml(d); for (const b of document.querySelectorAll("#tabs [data-tab]")) { b.classList.toggle("on", b.dataset.tab === tab); b.setAttribute("aria-selected", String(b.dataset.tab === tab)); } showProblems(); } return; }
    onAction(e);
  });

  // ── Start ────────────────────────────────────────────────────────────────────
  function onIssues(snap) {
    issues = snap.docs.filter((x) => x.exists).map((x) => ({ ...x.data(), id: x.id }));
    renderArchive();
    const d = cur();
    if (selectedId && d) {
      const changed = workId !== d.id || str(d.updatedAt) !== baseStamp;
      if (!changed) return;
      if (workId === d.id && isDirty()) showMsg("warn", "<b>Eine neuere Version liegt im Speicher.</b> Speichern überschreibt sie.");
      else { workId = null; renderMain(); }
    } else renderMain();
  }
  (async () => {
    const [u, d, m] = await Promise.all([
      window.claude?.use ? window.claude.use("user") : null,
      window.claude?.use ? window.claude.use("db") : null,
      window.claude?.use ? window.claude.use("mcp") : null,
    ]);
    if (u) { try { const me = await u.me(); actor = (me?.name || "").trim() || (me?.id ? `user:${String(me.id).slice(0, 8)}` : "unbekannt"); canEdit = await u.canEdit().catch(() => null); } catch (e) { log(`user.me ${e?.code ?? e}`); } }
    log(`user ${u ? "ok" : "null"} · actor ${actor} · canEdit ${canEdit}`);
    db = d; mcp = m;
    if (!db) { setPill("connDb", "bad", "kein Speicher"); banner("bad", `<b>Diese Ansicht erreicht den Artefakt-Speicher nicht.</b> Im Browser auf claude.ai öffnen, angemeldet.`); $("archive").innerHTML = `<div class="empty">Kein Speicher in dieser Ansicht.</div>`; }
    else {
      setPill("connDb", "ok", "Speicher verbunden");
      db.collection("issues").onSnapshot(onIssues, (e) => { log(`issues.onSnapshot ${e?.code}`); setPill("connDb", "bad", "Speicher: " + e?.code); });
      db.collection("settings").onSnapshot((snap) => { const s = snap.docs.find((x) => x.exists && x.id === "newsletter"); settings = s ? s.data() : {}; settingsExists = !!s; refreshPane(); }, (e) => log(`settings.onSnapshot ${e?.code}`));
      $("newBtn").disabled = !canWrite();
      if (canEdit === false) banner("warn", `<b>Nur lesen.</b> Bearbeiten dürfen Editoren dieser Seite.`);
    }
    if (!mcp) { setPill("connMcp", "bad", "keine Connectoren"); loadTemplates(false); }
    else { setPill("connMcp", "wait", "Lese Templates…"); await loadTemplates(false); }
  })();
})();
</script>
