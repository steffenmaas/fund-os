  <text x="616" y="464" font-size="15" font-weight="600">Check · drafted text</text><text x="616" y="482" font-size="13" class="muted">all rules met</text>
  <rect class="lg" x="800" y="456" width="70" height="24" rx="12"/><text class="lgt" x="835" y="473" font-size="13" text-anchor="middle">logged</text>
  <text x="886" y="473" font-size="14" font-weight="600" style="fill:#1d4ed8">undo</text>

  <rect class="row" x="550" y="500" width="380" height="48" rx="8"/>
  <text class="mono muted" x="562" y="529" font-size="14">09:01</text>
  <text x="616" y="520" font-size="15" font-weight="600">Ranking · deal list</text><text x="616" y="538" font-size="13" class="muted">attention set first</text>
  <rect class="lg" x="800" y="512" width="70" height="24" rx="12"/><text class="lgt" x="835" y="529" font-size="13" text-anchor="middle">logged</text>
  <text x="886" y="529" font-size="14" font-weight="600" style="fill:#1d4ed8">undo</text>
</g>
<text x="550" y="578" font-size="14" class="muted">Append-only: who, what, why, how to undo.</text>
<text x="550" y="598" font-size="14" class="muted">Every act is written here before it runs.</text>

<!-- human on the loop -->
<rect class="panel" x="990" y="280" width="180" height="336" rx="14"/>
<circle cx="1080" cy="334" r="22" fill="#1e3a8a"/>
<path d="M1044 398 C1044 360 1116 360 1116 398 Z" fill="#1e3a8a"/>
<text x="1080" y="436" font-size="18" font-weight="800" text-anchor="middle">Human on</text>
<text x="1080" y="458" font-size="18" font-weight="800" text-anchor="middle">the loop</text>
<g font-size="14" text-anchor="middle" class="muted">
  <text x="1080" y="490">reads the digest,</text>
  <text x="1080" y="508">approves and sends it</text>
  <text x="1080" y="526">from their mailbox</text>
</g>

<!-- links between panels -->
<g class="arrow march" style="stroke-dasharray: 6 5">
  <line x1="494" y1="448" x2="526" y2="448" marker-end="url(#ah)"/>
  <line x1="954" y1="448" x2="986" y2="448" marker-end="url(#ah)"/>
</g>
<text x="510" y="438" font-size="13" text-anchor="middle" class="muted">logs</text>
<text x="970" y="438" font-size="13" text-anchor="middle" class="muted">reads</text>

<!-- correction loop -->
<path class="loop" d="M1080 620 V642 H260 V622" marker-end="url(#ab)"/>
<text x="670" y="664" font-size="15" font-weight="600" text-anchor="middle" style="fill:#1e3a8a">corrects: edit · decline · send by hand (only a person sends)</text>
</svg>
