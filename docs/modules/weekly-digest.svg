<circle cx="444" cy="139" r="13" fill="#1e3a8a"/><text x="444" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">3</text>
<text x="466" y="144" font-size="14" class="muted">knowledge folder</text>
<text x="436" y="184" font-size="16" font-weight="700">Draft three</text><text x="436" y="205" font-size="16" font-weight="700">variants</text>
<text x="436" y="226" font-size="14" class="muted">at most seven picks</text>

