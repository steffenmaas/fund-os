  <rect class="q" x="800" y="400" width="70" height="24" rx="12"/><text class="qt" x="835" y="417" font-size="13" text-anchor="middle">queued</text>
  <text x="886" y="417" font-size="14" font-weight="600" style="fill:#1d4ed8">undo</text>

