<circle cx="52" cy="139" r="13" fill="#1e3a8a"/><text x="52" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">1</text>
<text x="74" y="144" font-size="14" class="muted">CRM</text>
<text x="44" y="184" font-size="16" font-weight="700">Read the</text><text x="44" y="205" font-size="16" font-weight="700">deal list</text>
<text x="44" y="226" font-size="14" class="muted">scores and stages</text>

<rect class="box b2" x="226" y="115" width="160" height="120" rx="12"/>
<circle cx="248" cy="139" r="13" fill="#1e3a8a"/><text x="248" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="270" y="144" font-size="14" class="muted">cockpit ranking</text>
<text x="240" y="184" font-size="16" font-weight="700">Rank</text><text x="240" y="205" font-size="16" font-weight="700">the deals</text>
<text x="240" y="226" font-size="14" class="muted">score x urgency</text>

