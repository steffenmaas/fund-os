<text x="662" y="144" font-size="14" class="muted">checks</text>
<text x="632" y="184" font-size="16" font-weight="700">Check the</text><text x="632" y="205" font-size="16" font-weight="700">text</text>
<text x="632" y="226" font-size="14" class="muted">one retry at most</text>

