<circle cx="836" cy="139" r="13" fill="#1e3a8a"/><text x="836" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">5</text>
<rect x="858" y="127" width="72" height="24" rx="12" fill="#1e3a8a"/><text x="894" y="144" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">approval</text>
<text x="828" y="184" font-size="16" font-weight="700">Queue one</text><text x="828" y="205" font-size="16" font-weight="700">approval</text>
<text x="828" y="226" font-size="14" class="muted">in every mode</text>

<rect class="box sw b6" x="1010" y="115" width="160" height="120" rx="12"/>
<circle cx="1032" cy="139" r="13" fill="#1e3a8a"/><text x="1032" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">6</text>
<rect x="1054" y="127" width="64" height="24" rx="12" fill="#1e3a8a"/><text x="1086" y="144" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">person</text>
<text x="1024" y="184" font-size="16" font-weight="700">A partner</text><text x="1024" y="205" font-size="16" font-weight="700">sends it</text>
<text x="1024" y="226" font-size="14" class="muted">from their mailbox</text>

<!-- travelling pulse -->
<g class="pulse"><circle cx="110" cy="175" r="15" fill="rgba(37,99,235,0.25)"/><circle cx="110" cy="175" r="7" fill="#2563eb"/></g>

<!-- legend -->
<circle cx="38" cy="262" r="5" fill="#2563eb"/><text x="52" y="267" font-size="14" class="muted">one digest moving through the module</text>
<rect x="392" y="253" width="26" height="16" rx="4" fill="#fff" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5 3"/><text x="428" y="267" font-size="14" class="muted">dashed border: a person decides this step</text>

<!-- variants panel -->
<rect class="panel" x="30" y="280" width="460" height="336" rx="14"/>
<text x="50" y="314" font-size="18" font-weight="800">Three variants, one approval</text>
<text x="470" y="314" font-size="14" class="muted" text-anchor="end">no switch</text>
<rect class="row v1" x="50" y="332" width="420" height="48" rx="8"/>
<rect class="lg" x="60" y="344" width="104" height="24" rx="12"/><text class="lgt" x="112" y="361" font-size="13" text-anchor="middle">internal</text>
<text x="178" y="361" font-size="14" class="muted">for partners; scores and stages are fine</text>
<rect class="row v2" x="50" y="388" width="420" height="48" rx="8"/>
<rect class="dr" x="60" y="400" width="104" height="24" rx="12"/><text class="drt" x="112" y="417" font-size="13" text-anchor="middle">co-investor</text>
<text x="178" y="417" font-size="14" class="muted">no score, no stage name, no valuation</text>
<rect class="row v3" x="50" y="444" width="420" height="48" rx="8"/>
<rect class="se" x="60" y="456" width="104" height="24" rx="12"/><text class="set" x="112" y="473" font-size="13" text-anchor="middle">LinkedIn</text>
<text x="178" y="473" font-size="14" class="muted">themes only, no late-stage company named</text>
<line x1="50" y1="502" x2="470" y2="502" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="50" y="520" font-size="16" font-weight="800">Guardrails, always on</text>
<g font-size="14">
  <text x="50" y="540">• An approval in every mode; nothing sent</text>
  <text x="50" y="556">• Each pick is a ranked name, at most seven</text>
  <text x="50" y="572">• No e-mail address, no foreign link</text>
  <text x="50" y="588">• No CRM write of any kind</text>
  <text x="50" y="604">• Fails the check twice: not queued</text>
</g>

<!-- feed panel -->
<rect class="panel" x="530" y="280" width="420" height="336" rx="14"/>
<text x="550" y="314" font-size="18" font-weight="800">Audit feed</text>
<text x="930" y="314" font-size="14" class="muted" text-anchor="end">written first</text>
