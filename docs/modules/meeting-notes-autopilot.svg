<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Meeting Notes Autopilot</title>
<desc id="d">A meeting ends and its summary is read from the meeting-notes tool. The module matches it to a CRM record by domain, attendee or title, drafts a short note in the fund's tone, and checks it for addresses, links and numbers. What happens next depends on the module's three-position switch (off, review-first, on): the note and the follow-up tasks are queued as approvals, or filed directly when the match is certain. A stage or status move is always only proposed as an approval. Every act is written to the audit feed first. A person on the loop reads the feed, can undo or follow up, and is the only one who changes the switch.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #111827; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { fill: #4b5563; }
  .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
  .sw { stroke: #1e3a8a; stroke-width: 2.5; stroke-dasharray: 7 5; }
  .panel { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 1.5; }
  .arrow { stroke: #475569; stroke-width: 2.5; fill: none; }
  .loop { stroke: #1e3a8a; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
  .knob { fill: rgba(37,99,235,0.14); stroke: #1e3a8a; stroke-width: 3; }
  .ring { fill: none; stroke-width: 3.5; opacity: 0; }
  .ring.r1 { opacity: 1; }
  .pulse { opacity: 0; }
  .q { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; } .qt { fill: #92400e; font-weight: 700; }
  .dr { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; } .drt { fill: #1e40af; font-weight: 700; }
  .se { fill: #d1fae5; stroke: #059669; stroke-width: 1.5; } .set { fill: #065f46; font-weight: 700; }
  .lg { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; } .lgt { fill: #334155; font-weight: 700; }
  .row { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; }

  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: travel 12s linear infinite; }
    .b1 { animation: lit 12s infinite 0.16s; } .b2 { animation: lit 12s infinite 1.67s; }
    .b3 { animation: lit 12s infinite 3.18s; } .b4 { animation: lit 12s infinite 4.69s; }
    .b5 { animation: lit 12s infinite 6.2s; }  .b6 { animation: lit 12s infinite 7.72s; }
    .knob { animation: knob 12s ease-in-out infinite; }
    .ring.r0 { animation: ring0 12s infinite; } .ring.r1 { animation: ring1 12s infinite; } .ring.r2 { animation: ring2 12s infinite; }
    .loop, .march { animation: march 1s linear infinite; }
    .fresh { animation: fresh 12s infinite; }
  }
  @keyframes travel { 0% { opacity: 0; transform: translateX(0); } 3% { opacity: 1; transform: translateX(0); } 66% { opacity: 1; transform: translateX(980px); } 70%, 100% { opacity: 0; transform: translateX(980px); } }
  @keyframes lit { 0% { fill: #ffffff; } 2%, 12% { fill: #dbeafe; } 16%, 100% { fill: #ffffff; } }
  @keyframes knob { 0%, 25% { transform: translateX(-140px); } 33%, 58% { transform: translateX(0); } 66%, 91% { transform: translateX(140px); } 100% { transform: translateX(-140px); } }
  @keyframes ring0 { 0%, 29% { opacity: 1; } 33%, 95% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes ring1 { 0%, 29% { opacity: 0; } 33%, 62% { opacity: 1; } 66%, 100% { opacity: 0; } }
  @keyframes ring2 { 0%, 62% { opacity: 0; } 66%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
  @keyframes march { to { stroke-dashoffset: -14; } }
  @keyframes fresh { 0%, 64% { fill: #ffffff; } 68%, 84% { fill: #dbeafe; } 92%, 100% { fill: #ffffff; } }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker>
</defs>

