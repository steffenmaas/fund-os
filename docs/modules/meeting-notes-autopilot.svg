<text x="970" y="438" font-size="13" text-anchor="middle" class="muted">reads</text>

<!-- correction loop -->
<path class="loop" d="M1080 620 V642 H260 V622" marker-end="url(#ab)"/>
<text x="670" y="664" font-size="15" font-weight="600" text-anchor="middle" style="fill:#1e3a8a">corrects: undo · follow up · change the switch (only a person does)</text>
