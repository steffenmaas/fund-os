  <rect class="row" x="550" y="500" width="380" height="48" rx="8"/>
  <text class="mono muted" x="562" y="529" font-size="14">08:09</text>
  <text x="616" y="520" font-size="15" font-weight="600">Meeting · matched</text><text x="616" y="538" font-size="13" class="muted">company record by domain</text>
  <rect class="lg" x="800" y="512" width="70" height="24" rx="12"/><text class="lgt" x="835" y="529" font-size="13" text-anchor="middle">logged</text>
  <text x="886" y="529" font-size="14" font-weight="600" style="fill:#1d4ed8">undo</text>
</g>
<text x="550" y="578" font-size="14" class="muted">Append-only: who, what, why, how to undo.</text>
<text x="550" y="598" font-size="14" class="muted">Every act is written here before it runs.</text>

<!-- human on the loop -->
