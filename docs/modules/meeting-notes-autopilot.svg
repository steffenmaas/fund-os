<!-- header -->
<text x="30" y="54" font-size="30" font-weight="800">Meeting Notes Autopilot</text>
<text x="30" y="86" font-size="17" class="muted">A meeting is matched to its record and filed as a note; next steps become tasks; a stage move is only ever proposed.</text>
