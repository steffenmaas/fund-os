<rect class="ring r0" x="54" y="402" width="132" height="38" rx="19" stroke="#d97706"/>
<rect class="ring r1" x="194" y="402" width="132" height="38" rx="19" stroke="#2563eb"/>
<rect class="ring r2" x="334" y="402" width="132" height="38" rx="19" stroke="#059669"/>
<rect class="q" x="60" y="408" width="120" height="26" rx="13"/><text class="qt" x="120" y="427" font-size="16" text-anchor="middle">queued</text>
<rect class="dr" x="200" y="408" width="120" height="26" rx="13"/><text class="drt" x="260" y="427" font-size="16" text-anchor="middle">note filed</text>
<rect class="se" x="340" y="408" width="120" height="26" rx="13"/><text class="set" x="400" y="427" font-size="16" text-anchor="middle">note + tasks</text>
<g font-size="14" text-anchor="middle" class="muted">
  <text x="120" y="462">everything waits</text><text x="120" y="480">for a person</text>
  <text x="260" y="462">note filed on a sure</text><text x="260" y="480">match, tasks wait</text>
  <text x="400" y="462">note and tasks filed</text><text x="400" y="480">on a sure match</text>
</g>
<line x1="50" y1="492" x2="470" y2="492" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="50" y="512" font-size="16" font-weight="800">Guardrails, always on</text>
<g font-size="14">
  <text x="50" y="534">• Never sends a mail or an invite</text>
  <text x="50" y="552">• Switch read again before every write</text>
  <text x="50" y="570">• Stage and status moves: approvals only</text>
  <text x="50" y="588">• No transcript, address or link in a note</text>
  <text x="50" y="606">• Only a person changes the switch</text>
</g>

