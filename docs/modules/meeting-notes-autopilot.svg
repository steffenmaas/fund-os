<g font-size="14" text-anchor="middle" class="muted">
  <text x="1080" y="490">reads the feed,</text>
  <text x="1080" y="508">undoes or follows up,</text>
  <text x="1080" y="526">owns the switch</text>
</g>

<!-- links between panels -->
