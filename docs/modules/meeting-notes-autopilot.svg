<circle cx="248" cy="139" r="13" fill="#1e3a8a"/><text x="248" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="270" y="144" font-size="14" class="muted">CRM</text>
<text x="240" y="184" font-size="16" font-weight="700">Match the</text><text x="240" y="205" font-size="16" font-weight="700">record</text>
<text x="240" y="226" font-size="14" class="muted">by domain or name</text>

