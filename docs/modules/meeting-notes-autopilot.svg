<rect x="858" y="127" width="64" height="24" rx="12" fill="#1e3a8a"/><text x="890" y="144" font-size="13" font-weight="700" text-anchor="middle" style="fill:#ffffff">switch</text>
<text x="828" y="184" font-size="16" font-weight="700">File note</text><text x="828" y="205" font-size="16" font-weight="700">and tasks</text>
<text x="828" y="226" font-size="14" class="muted">queued or filed</text>

<rect class="box b6" x="1010" y="115" width="160" height="120" rx="12"/>
<circle cx="1032" cy="139" r="13" fill="#1e3a8a"/><text x="1032" y="144" font-size="14" font-weight="700" text-anchor="middle" style="fill:#ffffff">6</text>
<text x="1054" y="144" font-size="14" class="muted">approval</text>
